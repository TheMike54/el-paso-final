name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly run: catches a runner image or Godot download that breaks without waiting for a PR.
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit messages without assistant attribution
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then rango=("$BASE..$HEAD"); else rango=(-1 HEAD); fi
          git log --format=%B "${rango[@]}" > "$RUNNER_TEMP/mensajes.txt"
          sh herramientas/githooks/commit-msg "$RUNNER_TEMP/mensajes.txt" || { echo "::error::A commit message carries an AI assistant attribution line"; exit 1; }

      - name: No local or binary files tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(CLAUDE\.local\.md|settings\.local\.json)$|\.(apk|aab|keystore|jks|pem|key)$'; then
            echo "::error::Local-only or binary files are tracked"
            exit 1
          fi

      - name: Document links and generated tables
        shell: pwsh
        run: |
          ./herramientas/revisar-enlaces.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./herramientas/generar-tablas.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --exit-code -- docs/manual/tablas-generadas.md
          if ($LASTEXITCODE -ne 0) { Write-Output '::error::docs/manual/tablas-generadas.md is out of date: run herramientas/generar-tablas.ps1'; exit 1 }

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and validate
        shell: bash
        run: |
          godot --headless --path . --import 2>&1 | tee validar.log
          godot --headless --path . res://herramientas/validar.tscn --quit-after 600 2>&1 | tee -a validar.log
          if grep -nE 'SCRIPT ERROR|^[[:space:]]*ERROR:|^FALLO ' validar.log; then
            echo "::error::Validation found errors"
            exit 1
          fi
          resumenes=$(grep -cE '^VALIDACION archivos=[0-9]+ fallos=[0-9]+$' validar.log || true)
          if [ "$resumenes" != 1 ] || ! grep -qE '^VALIDACION archivos=[0-9]+ fallos=0$' validar.log; then
            echo "::error::The validator scene did not print exactly one summary with fallos=0"
            exit 1
          fi

      - name: Input scripts
        shell: bash
        run: |
          shopt -s nullglob globstar
          estado=0
          for guion in herramientas/guiones/**/*.guion; do
            salida=$(godot --headless --path . --fixed-fps 60 --quit-after 7200 -- --guion="$guion" 2>&1) || true
            if ! grep -q '^GUION OK' <<<"$salida" || grep -qE 'SCRIPT ERROR|^[[:space:]]*ERROR:' <<<"$salida"; then
              echo "::error file=$guion::$(grep -E '^GUION|ERROR' <<<"$salida" | head -3 | tr '\n' ' ')"
              estado=1
            fi
          done
          exit "$estado"
