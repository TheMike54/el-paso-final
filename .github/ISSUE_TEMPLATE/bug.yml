name: Bug
description: Reproducible defect with expected and observed results
title: "fix: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the commit or version and the device or API level
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
